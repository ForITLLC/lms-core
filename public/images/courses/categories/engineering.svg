<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Engineering terminal with code and merge graph">
  <defs>
    <linearGradient id="engBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#engBg)"/>
  <g opacity="0.18" stroke="#334155" stroke-width="1">
    <path d="M0 50 L1200 50 M0 100 L1200 100 M0 150 L1200 150 M0 200 L1200 200 M0 250 L1200 250 M0 300 L1200 300 M0 350 L1200 350"/>
  </g>
  <g transform="translate(110 70)">
    <rect width="540" height="260" rx="12" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
    <rect width="540" height="32" rx="12" fill="#1e293b"/>
    <rect y="20" width="540" height="12" fill="#1e293b"/>
    <circle cx="20" cy="16" r="6" fill="#ef4444"/>
    <circle cx="42" cy="16" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="16" r="6" fill="#22c55e"/>
    <g font-family="ui-monospace,SFMono-Regular,monospace" font-size="14">
      <text x="22" y="68" fill="#94a3b8">$</text>
      <text x="40" y="68" fill="#f8fafc">git checkout -b feat/versioning</text>
      <text x="22" y="98" fill="#22c55e">✓</text>
      <text x="40" y="98" fill="#cbd5e1">Switched to a new branch</text>
      <text x="22" y="128" fill="#94a3b8">$</text>
      <text x="40" y="128" fill="#f8fafc">npm run typecheck</text>
      <text x="22" y="158" fill="#22c55e">✓</text>
      <text x="40" y="158" fill="#cbd5e1">0 errors</text>
      <text x="22" y="188" fill="#94a3b8">$</text>
      <text x="40" y="188" fill="#f8fafc">gh pr create</text>
      <text x="22" y="218" fill="#a5b4fc">→</text>
      <text x="40" y="218" fill="#a5b4fc">https://github.com/...</text>
    </g>
  </g>
  <g transform="translate(740 80)" stroke-width="3" fill="none">
    <path d="M40 0 L40 240" stroke="#6366f1"/>
    <path d="M40 60 C 90 60 130 80 130 130 L 130 240" stroke="#22c55e"/>
    <path d="M40 130 C 220 130 260 150 260 200 L 260 240" stroke="#f59e0b"/>
    <circle cx="40"  cy="20"  r="9" fill="#6366f1"/>
    <circle cx="40"  cy="60"  r="9" fill="#6366f1"/>
    <circle cx="130" cy="130" r="9" fill="#22c55e"/>
    <circle cx="130" cy="180" r="9" fill="#22c55e"/>
    <circle cx="40"  cy="130" r="9" fill="#6366f1"/>
    <circle cx="40"  cy="220" r="9" fill="#6366f1"/>
    <circle cx="260" cy="200" r="9" fill="#f59e0b"/>
    <circle cx="260" cy="240" r="9" fill="#f59e0b"/>
  </g>
</svg>
